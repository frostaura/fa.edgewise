name: build-edgewise

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore Edgewise.slnx

      - name: Format check
        run: dotnet format Edgewise.slnx --verify-no-changes

      - name: Build
        run: dotnet build Edgewise.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test Edgewise.slnx --no-build --configuration Release --logger "console;verbosity=normal"

  test-web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: src/web
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: src/web/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Design-token gate
        run: |
          set -euo pipefail
          # Fail on raw color/size literals in Tailwind arbitrary values, e.g. bg-[#0f0f0f] or w-[137px].
          # Everything outside components/ui must use design tokens.
          hits=$(grep -rEn '\[(#|[0-9]+(px|rem|%))' src --include='*.tsx' --include='*.ts' --exclude-dir=ui || true)
          # Optional per-line exclusion list (exact substring matches), one entry per line.
          if [ -n "$hits" ] && [ -f .design-token-allowlist ]; then
            hits=$(printf '%s\n' "$hits" | grep -vFf .design-token-allowlist || true)
          fi
          if [ -n "$hits" ]; then
            echo "Design-token gate failed. Raw color/size literals found outside components/ui:"
            printf '%s\n' "$hits"
            echo "Use theme tokens instead, or add an exact-match line to src/web/.design-token-allowlist."
            exit 1
          fi
          echo "Design-token gate passed."

      - name: Build
        run: npm run build

  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test-api, test-web]
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: src/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edgewise-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edgewise-api:${{ github.sha }}
          cache-from: type=gha,scope=edgewise-api
          cache-to: type=gha,mode=max,scope=edgewise-api

      - name: Build and push web image
        uses: docker/build-push-action@v5
        with:
          context: src/web
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/edgewise-web:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/edgewise-web:${{ github.sha }}
          cache-from: type=gha,scope=edgewise-web
          cache-to: type=gha,mode=max,scope=edgewise-web
